name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hycare
          POSTGRES_PASSWORD: hycare
          POSTGRES_DB: hycare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hycare -d hycare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hycare:hycare@127.0.0.1:5432/hycare_test
      BETTER_AUTH_SECRET: test-secret-test-secret-test-secret-32
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORE_TIMEZONE: Asia/Beirut
      EMAIL_FROM: HyCare <test@hycare.test>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
